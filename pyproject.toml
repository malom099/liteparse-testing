[project]
name = "liteparse-eval"
version = "0.1.0"
description = "LiteParse document parsing quality evaluator — NiceGUI browser app and CLI batch tool"
requires-python = ">=3.12"
authors = [{ name = "Ocean Capital Investments" }]
license = { text = "Proprietary" }

# ---------------------------------------------------------------------------
# Ruff — linter & formatter
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    ".venv",
    "__pycache__",
    "samples",
    "results",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modern Python idioms)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line too long — handled by formatter
    "B905",  # zip() without strict=
]

[tool.ruff.lint.isort]
known-first-party = ["evaluate", "quality_check"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pyright — static type checker
# ---------------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
extraPaths = ["../OCHLDocumentParsingLibrary/src"]
exclude = [
    ".venv",
    "__pycache__",
    "samples",
    "results",
]

# ---------------------------------------------------------------------------
# Bandit — security linter
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = [".venv", "samples", "results"]
skips = ["B101", "B404", "B603", "B607"]
# B101: assert in helpers
# B404/B603/B607: subprocess use in check_changelog_reminder.py is intentional
#   and does not accept user-controlled input

# ---------------------------------------------------------------------------
# Vulture — dead code detector
# ---------------------------------------------------------------------------
[tool.vulture]
min_confidence = 60
paths = ["app.py", "evaluate.py", "quality_check.py"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov=evaluate --cov=quality_check --cov-report=term-missing"
